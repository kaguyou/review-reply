<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口コミ返信 下書きツール（試作版）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; margin: 0; background: #f6f4ef; color: #2b2b2b; line-height: 1.7; }
  header { background: #31572c; color: #fff; padding: 20px 16px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  section { background: #fff; border: 1px solid #e2ddd2; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 16px; margin: 0 0 12px; border-left: 4px solid #31572c; padding-left: 8px; }
  label { display: block; font-size: 13px; font-weight: bold; margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], select, textarea { width: 100%; padding: 9px; border: 1px solid #c9c2b2; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff; }
  textarea { min-height: 110px; resize: vertical; }
  .hint { font-size: 12px; color: #777; margin-top: 2px; }
  .stars { display: flex; gap: 6px; margin-top: 4px; }
  .stars button { font-size: 22px; background: #fff; border: 1px solid #c9c2b2; border-radius: 6px; width: 46px; height: 42px; cursor: pointer; color: #c9c2b2; }
  .stars button.on { color: #e8a020; border-color: #e8a020; background: #fdf6e3; }
  .gen { display: block; width: 100%; margin-top: 18px; padding: 13px; font-size: 16px; font-weight: bold; background: #31572c; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .gen:hover { background: #274a22; }
  .warn { display: none; background: #fdecea; border: 1px solid #d9534f; color: #8f2d28; border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; }
  .note { display: none; background: #fff8e1; border: 1px solid #e0c060; color: #6b5510; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .cards { display: grid; gap: 14px; }
  @media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
  .card { border: 1px solid #e2ddd2; border-radius: 10px; padding: 14px; background: #fffdf8; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: #31572c; }
  .card .body { white-space: pre-wrap; font-size: 13.5px; flex: 1; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .card .count { font-size: 12px; color: #888; }
  .copy { padding: 6px 14px; font-size: 13px; background: #fff; border: 1px solid #31572c; color: #31572c; border-radius: 6px; cursor: pointer; }
  .copy:hover { background: #eef4ec; }
  #results { display: none; }
  .empty { color: #999; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>口コミ返信 下書きツール</h1>
  <p>口コミを貼るだけで、返信の下書きを3パターン作ります。試作版（オフライン動作）</p>
</header>
<main>

  <section>
    <h2>お店の設定</h2>
    <label for="storeName">店舗名</label>
    <input type="text" id="storeName" placeholder="例: 麺屋 たかはし">
    <label for="genre">業種</label>
    <select id="genre">
      <option value="飲食店">飲食店</option>
      <option value="美容室・サロン">美容室・サロン</option>
      <option value="小売店">小売店</option>
      <option value="その他">その他</option>
    </select>
    <label for="feature">お店の特徴（任意）</label>
    <input type="text" id="feature" placeholder="例: 自家製麺と無化調スープ">
    <p class="hint">名詞句で入れると、高評価への返信の中で自然に触れます。空欄でも問題ありません。</p>
  </section>

  <section>
    <h2>口コミを貼り付け</h2>
    <label for="sampleSel">サンプルで試す（動作確認用）</label>
    <select id="sampleSel">
      <option value="">― サンプルを選ぶと自動で入力されます ―</option>
    </select>
    <label>星評価</label>
    <div class="stars" id="stars">
      <button type="button" data-v="1">★</button>
      <button type="button" data-v="2">★</button>
      <button type="button" data-v="3">★</button>
      <button type="button" data-v="4">★</button>
      <button type="button" data-v="5">★</button>
    </div>
    <label for="reviewText">口コミ本文</label>
    <textarea id="reviewText" placeholder="口コミの本文をここに貼り付けてください"></textarea>
    <button class="gen" id="genBtn" type="button">返信案を3パターン作る</button>
  </section>

  <div class="warn" id="critWarn"></div>
  <div class="note" id="piiNote"></div>

  <section id="results">
    <h2>返信案（内容を確認してからお使いください）</h2>
    <div class="cards">
      <div class="card">
        <h3>丁寧</h3>
        <div class="body" id="out-polite"></div>
        <div class="meta"><span class="count" id="cnt-polite"></span><button class="copy" data-t="polite" type="button">コピー</button></div>
      </div>
      <div class="card">
        <h3>親しみ</h3>
        <div class="body" id="out-friendly"></div>
        <div class="meta"><span class="count" id="cnt-friendly"></span><button class="copy" data-t="friendly" type="button">コピー</button></div>
      </div>
      <div class="card">
        <h3>簡潔</h3>
        <div class="body" id="out-short"></div>
        <div class="meta"><span class="count" id="cnt-short"></span><button class="copy" data-t="short" type="button">コピー</button></div>
      </div>
    </div>
  </section>

  <p class="empty">※ 返信案は下書きです。投稿前に必ず内容をご確認ください。事実と異なる約束や、個別の事情への言及は含まれていません。</p>
</main>

      short: ["ご意見を今後の改善に活かしてまいります。またのご来店をお待ちしております。", "改善に努めてまいります。またのお越しをお待ちしております。"]
    },
    low: {
      polite: [
        "もしよろしければ、改善した姿をご覧いただける機会を、もう一度いただけますと幸いです。",
        "至らなかった点を改め、次回はご満足いただけるよう努めますので、機会がございましたらまたのご来店をお待ちしております。"
      ],
      friendly: [
        "よかったら、直したところを見に、もう一度来てもらえたらうれしいです。",
        "次はちゃんと満足してもらえるようにするので、よかったらまた来てください。"
      ],
      short: ["改善のうえ、またのご来店をお待ちしております。", "至らぬ点を改め、またのお越しをお待ちしております。"]
    }
  };

  // 重大クレーム専用文型（口調差は最小限。事実を断定せず、個別対応への誘導のみ）
  const CRITICAL_TEMPLATES = {
    polite: "このたびは{store}をご利用いただいたにもかかわらず、ご不快な思いをおかけし、誠に申し訳ございません。いただいたご指摘は重大な内容として受け止めております。事実関係を確認のうえ、店舗より個別に対応させていただきます。差し支えなければ、ご来店の日時をお知らせいただけますと幸いです。",
    friendly: "{store}に来てくれたのに、このような思いをさせてしまって本当に申し訳ありません。いただいた内容は重大なこととして受け止めています。確認のうえ、お店から個別に対応させてください。よければ、来店した日時を教えてもらえると助かります。",
    short: "ご来店ありがとうございました。ご指摘は重大な内容として受け止め、事実関係を確認のうえ、店舗より個別に対応いたします。ご来店日時をお知らせいただけますと幸いです。"
  };

  function hashCode(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function pick(variants, seed) { return variants[seed % variants.length]; }

  function fill(tpl, store) { return tpl.split("{store}").join(store); }

  function analyze(text) {
    const critical = CRITICAL_KEYWORDS.some(k => text.includes(k));
    const hasPII = PII_PATTERNS.some(re => re.test(text));
    const hits = [];
    for (const cat of CATEGORIES) {
      const negHit = cat.neg.some(k => text.includes(k));
      const posHit = cat.pos.some(k => text.includes(k));
      if (negHit) hits.push({ id: cat.id, label: cat.label, kind: "complaint", frag: cat.complaint });
      else if (posHit) hits.push({ id: cat.id, label: cat.label, kind: "praise", frag: cat.praise });
    }
    return { critical, hasPII, hits };
  }

  function buildTone(tone, band, store, feature, hits, seed) {
    const parts = [];
    parts.push(fill(pick(OPENINGS[band][tone], seed), store));

    const praises = hits.filter(h => h.kind === "praise");
    const complaints = hits.filter(h => h.kind === "complaint");

    if (band === "high") {
      for (const h of praises.slice(0, 2)) parts.push(h.frag[tone]);
      if (feature && tone !== "short") {
        parts.push(tone === "polite"
          ? `当店は${feature}を心がけております。その点も感じていただけていたら、何よりうれしく思います。`
          : `${feature}っていう当店のこだわりも、感じてもらえてたらうれしいです。`);
      }
      for (const h of complaints.slice(0, 1)) {
        parts.push(h.frag[tone]);
        parts.push(tone === "short" ? "この点は改善に努めます。" : "この点は真摯に受け止め、改善に努めます。");
      }
    } else if (band === "mid") {
      for (const h of praises.slice(0, 1)) parts.push(h.frag[tone]);
      for (const h of complaints.slice(0, 2)) parts.push(h.frag[tone]);
      if (complaints.length > 0) parts.push(IMPROVE_LINES[tone]);
    } else { // low
      for (const h of complaints.slice(0, 2)) parts.push(h.frag[tone]);
      parts.push(IMPROVE_LINES[tone]);
      for (const h of praises.slice(0, 1)) {
        parts.push(tone === "short" ? "その中でも良い点に触れていただき、感謝いたします。" : "そのような中でも良い点に触れていただき、ありがとうございます。至らぬ点と合わせて真摯に受け止めます。");
      }
    }

    parts.push(pick(CLOSINGS[band][tone], seed + 1));
    return parts.join("\n");
  }

  function generate(input) {
    const store = (input.store || "").trim() || "当店";
    const feature = (input.feature || "").trim();
    const stars = Math.min(5, Math.max(1, parseInt(input.stars, 10) || 3));
    const text = String(input.text || "");
    const a = analyze(text);
    const band = stars >= 4 ? "high" : (stars === 3 ? "mid" : "low");
    const seed = hashCode(text + "|" + stars + "|" + store);

    let replies;
    if (a.critical) {
      replies = {
        polite: fill(CRITICAL_TEMPLATES.polite, store),
        friendly: fill(CRITICAL_TEMPLATES.friendly, store),
        short: fill(CRITICAL_TEMPLATES.short, store)
      };
    } else {
      replies = {
        polite: buildTone("polite", band, store, feature, a.hits, seed),
        friendly: buildTone("friendly", band, store, feature, a.hits, seed),
        short: buildTone("short", band, store, feature, a.hits, seed)
      };
    }
    return {
      replies,
      critical: a.critical,
      hasPII: a.hasPII,
      band,
      matchedTopics: a.hits.map(h => ({ id: h.id, label: h.label, kind: h.kind }))
    };
  }

  // ---- 動作確認用サンプル口コミ10件 ----
  const SAMPLES = [
    { name: "S01 星5・飲食（味＋接客）", store: "麺屋 たかはし", genre: "飲食店", feature: "自家製麺と無化調スープ", stars: 5,
      text: "初めて行きましたが、ラーメンが本当に美味しかったです。自家製麺のコシが絶妙で、スープまで飲み干しました。店員さんも笑顔で親切に対応してくれて、気持ちよく食事できました。また必ず行きます。" },
    { name: "S02 星5・美容（技術＋接客）", store: "hair salon Lumo", genre: "美容室・サロン", feature: "髪質改善トリートメント", stars: 5,
      text: "カットとカラーをお願いしました。仕上がりがイメージ通りで大満足です。担当のスタッフさんが丁寧にカウンセリングしてくれて、家でのケア方法まで教えてくれました。" },
    { name: "S03 星4・小売（品揃え＋価格）", store: "雑貨店 マルシェ青葉", genre: "小売店", feature: "地元作家のハンドメイド雑貨", stars: 4,
      text: "品揃えが豊富で、見ているだけでも楽しいお店です。価格もリーズナブルで、つい色々買ってしまいました。贈り物用のラッピングも快く対応してもらえました。" },
    { name: "S04 星4・飲食（味は高評価／待ち時間に不満）", store: "カフェ そらまめ", genre: "飲食店", feature: "自家焙煎コーヒーと手作りケーキ", stars: 4,
      text: "ケーキが美味しくて、コーヒーとの相性も抜群でした。ただ、注文してから出てくるのが遅くて、待ち時間が気になりました。味は文句なしなので、提供がもう少し早いと完璧です。" },
    { name: "S05 星3・飲食（可もなく不可もなく＋混雑）", store: "大衆食堂 ふくまる", genre: "飲食店", feature: "", stars: 3,
      text: "定食は普通に美味しかったです。可もなく不可もなく、といった感じ。昼時はかなり混んでいて、席に着くまで少し待ちました。近くに来たらまた寄るかもしれません。" },
    { name: "S06 星3・美容（仕上がり良／予約に不満）", store: "ネイルサロン Claire", genre: "美容室・サロン", feature: "持ちの良いジェルネイル", stars: 3,
      text: "仕上がりはとても可愛くて満足しています。ただ、予約したのに15分ほど待たされてしまいました。施術は丁寧だっただけに、時間通りに始めてほしかったです。" },
    { name: "S07 星2・小売（接客＋在庫）", store: "文具店 ペンと紙", genre: "小売店", feature: "", stars: 2,
      text: "お目当ての商品がなく、在庫も確認してもらえませんでした。店員の態度が悪く、聞いてもそっけない対応で残念です。立地は良いのに、もったいないと思いました。" },
    { name: "S08 星2・飲食（清潔さ＋価格）", store: "居酒屋 わらじ屋", genre: "飲食店", feature: "", stars: 2,
      text: "料理は普通でしたが、テーブルがベタベタしていて汚いのが気になりました。店内の清潔さにもう少し気を配ってほしいです。値段も割高に感じました。" },
    { name: "S09 星1・飲食（接客＋待ち時間・強い不満）", store: "焼肉 だるま亭", genre: "飲食店", feature: "", stars: 1,
      text: "最悪でした。注文してから40分以上待たされ、店員を呼んでも無視されました。やっと来た店員の態度が悪く、謝罪もなし。二度と行きません。友人にも勧めません。" },
    { name: "S10 星1・飲食（異物混入＝重大クレーム）", store: "洋食キッチン ポム", genre: "飲食店", feature: "", stars: 1,
      text: "オムライスに異物が入っていました。すぐに店員さんに伝えましたが、とても心配です。衛生管理はどうなっているのでしょうか。きちんとした説明がほしいです。" }
  ];

  return { generate, analyze, SAMPLES, CRITICAL_KEYWORDS };
})();
</script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let stars = 5;

  const starBtns = document.querySelectorAll("#stars button");
  function renderStars() {
    starBtns.forEach(b => b.classList.toggle("on", parseInt(b.dataset.v, 10) <= stars));
  }
  starBtns.forEach(b => b.addEventListener("click", () => { stars = parseInt(b.dataset.v, 10); renderStars(); }));
  renderStars();

  const sel = $("sampleSel");
  ReviewReplyEngine.SAMPLES.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    if (sel.value === "") return;
    const s = ReviewReplyEngine.SAMPLES[parseInt(sel.value, 10)];
    $("storeName").value = s.store;
    $("genre").value = s.genre;
    $("feature").value = s.feature;
    $("reviewText").value = s.text;
    stars = s.stars;
    renderStars();
  });

  $("genBtn").addEventListener("click", () => {
    const text = $("reviewText").value.trim();
    if (!text) { alert("口コミ本文を貼り付けてください。"); return; }
    const r = ReviewReplyEngine.generate({
      store: $("storeName").value,
      genre: $("genre").value,
      feature: $("feature").value,
      stars: stars,
      text: text
    });

    const warn = $("critWarn");
    if (r.critical) {
      warn.style.display = "block";
      warn.textContent = "⚠ この口コミには、健康・安全や金銭に関わる重大な内容が含まれている可能性があります。生成された返信案は最小限の型のみです。内容をご自身で確認し、事実関係を把握したうえで、店主ご自身の言葉で対応することを強くおすすめします。";
    } else {
      warn.style.display = "none";
    }

    const note = $("piiNote");
    if (r.hasPII) {
      note.style.display = "block";
      note.textContent = "※ 貼り付けた口コミに、電話番号やメールアドレスらしき文字列が含まれています。生成される返信案にはそれらを一切含めていません。";
    } else {
      note.style.display = "none";
    }

    for (const tone of ["polite", "friendly", "short"]) {
      $("out-" + tone).textContent = r.replies[tone];
      $("cnt-" + tone).textContent = r.replies[tone].length + "文字";
    }
    $("results").style.display = "block";
    $("results").scrollIntoView({ behavior: "smooth" });
  });

  document.querySelectorAll(".copy").forEach(btn => {
    btn.addEventListener("click", async () => {
      const t = $("out-" + btn.dataset.t).textContent;
      try { await navigator.clipboard.writeText(t); btn.textContent = "コピーしました"; }
      catch (e) {
        const ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        btn.textContent = "コピーしました";
      }
      setTimeout(() => { btn.textContent = "コピー"; }, 1600);
    });
  });
})();
</script>
